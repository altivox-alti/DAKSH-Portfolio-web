<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="altiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e1726" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="300" height="300" rx="30" fill="#080c14"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Alti Head Chassis -->
  <rect x="75" y="80" width="150" height="130" rx="36" fill="url(#altiGlow)" stroke="#67e8f9" stroke-width="3" filter="url(#neon)"/>
  
  <!-- Antenna with pulsing orb -->
  <line x1="150" y1="80" x2="150" y2="45" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="150" cy="40" r="10" fill="#a5f3fc" filter="url(#neon)"/>

  <!-- Visor Screen -->
  <rect x="95" y="110" width="110" height="65" rx="18" fill="#040810" stroke="#0891b2" stroke-width="2"/>

  <!-- Cute Expressive Glowing Eyes -->
  <ellipse cx="125" cy="140" rx="12" ry="16" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="128" cy="135" r="4" fill="#ffffff"/>
  <ellipse cx="175" cy="140" rx="12" ry="16" fill="#22d3ee" filter="url(#neon)"/>
  <circle cx="178" cy="135" r="4" fill="#ffffff"/>

  <!-- Cheek Glow Blush -->
  <circle cx="108" cy="160" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="192" cy="160" r="6" fill="#38bdf8" opacity="0.6"/>

  <!-- Mascot Tag -->
  <rect x="85" y="230" width="130" height="30" rx="8" fill="#091b2e" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="150" y="250" font-family="monospace" font-size="12" font-weight="bold" fill="#67e8f9" text-anchor="middle" letter-spacing="2">ALTI · AI BRAIN</text>
</svg>
