<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38"/>
      <stop offset="70%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Circuit grid pattern -->
  <g stroke="#06b6d4" stroke-width="0.75" opacity="0.18">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Stylized Hologram Avatar Silhouette for Daksh -->
  <!-- Shoulders / Cyber Jacket -->
  <path d="M 90 350 C 100 280, 150 250, 200 250 C 250 250, 300 280, 310 350 Z" fill="#091b2e" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Jacket Collar details -->
  <path d="M 160 255 L 200 300 L 240 255" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="200" y1="300" x2="200" y2="350" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Neck -->
  <rect x="182" y="210" width="36" height="45" rx="4" fill="#0d233a" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="165" rx="55" ry="65" fill="#0c1e33" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Modern Cyber Hair -->
  <path d="M 145 155 C 140 100, 190 90, 215 90 C 245 90, 260 115, 255 145 C 240 115, 220 115, 200 115 C 180 115, 160 130, 145 155 Z" fill="#06b6d4" opacity="0.85"/>

  <!-- Cyber Visor / HUD Eyewear -->
  <path d="M 160 160 Q 200 152 240 160 L 243 175 Q 200 185 157 175 Z" fill="#06b6d4" opacity="0.75" filter="url(#glow)"/>
  <line x1="165" y1="168" x2="235" y2="168" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Identification Overlay -->
  <rect x="110" y="325" width="180" height="34" rx="8" fill="#050b14" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
  <text x="200" y="347" font-family="monospace" font-size="13" font-weight="bold" fill="#06b6d4" text-anchor="middle" letter-spacing="2">DAKSH PATEL · IT20</text>

  <!-- Glowing Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M 350 20 L 380 20 L 380 50" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <path d="M 20 350 L 20 380 L 50 380" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M 350 380 L 380 380 L 380 350" fill="none" stroke="#a855f7" stroke-width="3"/>
</svg>
